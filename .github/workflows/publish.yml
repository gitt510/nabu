name: publish

# Publishes the tasks of the calling notebook repository to R2, where the
# nabu viewer reads them. A notebook repository calls it on every push:
#
#   on: { push: { branches: [main] } }
#   jobs:
#     publish:
#       uses: gitt510/nabu/.github/workflows/publish.yml@main
#       with: { r2-bucket: nabu }
#       secrets: { R2_EDIT: ${{ secrets.R2_EDIT }} }
#
# Contract with callers:
#   - the notebook is the root of the calling repository
#   - R2_EDIT can edit r2-bucket in the one account it carries
#   - <r2-bucket>/tasks.json is replaced by the tasks of the pushed commit
on:
  workflow_call:
    inputs:
      r2-bucket:
        description: R2 bucket that receives tasks.json.
        type: string
        required: true
    secrets:
      R2_EDIT:
        description: Cloudflare API token with R2 edit permission in the account that holds r2-bucket.
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A newer push supersedes an older one, so a stale tasks.json never lands last.
    concurrency:
      group: nabu-publish-${{ github.repository }}
      cancel-in-progress: true
    steps:
      # Full history: nabu reads when each task was last committed.
      - uses: actions/checkout@v4
        with:
          path: notebook
          fetch-depth: 0

      # nabu at main: a called workflow cannot read the ref its caller pinned.
      - uses: actions/checkout@v4
        with:
          repository: gitt510/nabu
          path: nabu

      - uses: jdx/mise-action@v2
        with:
          working_directory: nabu
          install_args: go node pnpm

      - name: Build tasks.json
        working-directory: nabu
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/nabu"
          printf '{"notebook": "%s"}\n' "$GITHUB_WORKSPACE/notebook" > "$XDG_CONFIG_HOME/nabu/config.json"
          go run . task ls --json > web/data.json
          pnpm install --frozen-lockfile
          pnpm --filter nabu-web run data

      - name: Upload to R2
        working-directory: nabu/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_EDIT }}
        run: >-
          pnpm exec wrangler r2 object put "${{ inputs.r2-bucket }}/tasks.json"
          --file dist/tasks.json --content-type "application/json; charset=utf-8" --remote
