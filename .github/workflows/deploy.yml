name: deploy

on:
  push:
    branches: [main]

# Keep only the newest deploy when several land on main in quick succession.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: the shared deploy workflow does not test. Deploy is skipped if this fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: go test ./...

  # Deploys the viewer page; the tasks it shows come from the publish workflow, not from here.
  deploy:
    needs: test
    uses: gitt510/.github/.github/workflows/deploy-worker-pnpm.yml@6b1d55c320755e6cd34095a80ed064a0ca367d72
    with:
      working-directory: web
      assets-package: nabu-web
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
