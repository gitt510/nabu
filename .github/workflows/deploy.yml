name: deploy

on:
  push:
    branches: [main]

# Keep only the newest deploy when several land on main in quick succession.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deploys the Worker: the viewer page and the API. The tasks live in D1, not here.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile

      - run: go test ./...
      - run: pnpm --silent check
        working-directory: web
      - run: pnpm --silent test
        working-directory: web

      - run: pnpm --silent build
        working-directory: web
      - run: pnpm exec wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
