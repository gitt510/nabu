name: ci

on:
  pull_request:

# Keep only the newest run when a pull request gets several pushes in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lints and tests the Worker and the viewer: pnpm check runs the types and oxlint, and pnpm test fails on a
  # stale openapi.json, so a pull request that breaks either shows here before the deploy workflow would stop on main.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --silent check
      - run: pnpm --silent test
